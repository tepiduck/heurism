[project]
name = "pmbot"
version = "0.1.0"
description = "Polymarket microstructure trading research and execution scaffold."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.0",
    "typer>=0.16.0",
    "websockets>=13.0",
]

[project.scripts]
pmbot = "pmbot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pmbot"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
